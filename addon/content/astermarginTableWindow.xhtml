<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/overlay.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotero-platform/content/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://astermargin/content/styles/agent-ui-tokens.css" type="text/css"?>
<?xml-stylesheet href="chrome://astermargin/content/styles/agent-ui-utilities.css" type="text/css"?>
<?xml-stylesheet href="chrome://astermargin/content/styles/agent-ui-components.css" type="text/css"?>
<?xml-stylesheet href="chrome://astermargin/content/styles/agent-ui-table.css" type="text/css"?>
<?xml-stylesheet href="chrome://astermargin/content/styles/astermargin.css" type="text/css"?>
<?xml-stylesheet href="chrome://astermargin/content/styles/katex-embedded.css" type="text/css"?>
<!DOCTYPE window>
<!-- A stored table in a window of its own (src/ui/tableWindow.ts). The title
     is the table's, set once the table loads. -->
<window
    id="astermargin-table-window"
    orient="vertical"
    width="1200"
    height="760"
    minwidth="560"
    minheight="360"
    title="AsterMargin Table"
    persist="screenX screenY width height"
    windowtype="astermargin:table"
    xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    xmlns:html="http://www.w3.org/1999/xhtml"
>
    <linkset>
        <html:link rel="localization" href="browser/menubar.ftl"/>
        <html:link rel="localization" href="browser/browserSets.ftl"/>
        <html:link rel="localization" href="toolkit/global/textActions.ftl"/>
        <html:link rel="localization" href="astermargin-mainWindow.ftl"/>
    </linkset>

    <script type="application/javascript" src="chrome://astermargin/content/astermarginTableWindow.js"/>

    <!-- Handlers are attached in astermarginTableWindow.js: the chrome CSP blocks
         inline on* attributes. Every table action is a command whose
         data-table-command names it for src/ui/tableWindow.ts, which also
         enables and disables them as a menu opens. -->
    <commandset id="astermarginTableCommands">
        <command id="cmd_astermarginTableShowInLibrary" data-table-command="show-in-library"/>
        <command id="cmd_astermarginTableExportXlsx" data-table-command="export-xlsx"/>
        <command id="cmd_astermarginTableExportCsv" data-table-command="export-csv"/>
        <command id="cmd_astermarginTableCopyText" data-table-command="copy-text"/>
        <command id="cmd_astermarginTableFind" data-table-command="find"/>
        <command id="cmd_astermarginTableDensityCompact" data-table-command="density-compact"/>
        <command id="cmd_astermarginTableDensityCozy" data-table-command="density-cozy"/>
        <command id="cmd_astermarginTableDensityTall" data-table-command="density-tall"/>
        <command id="cmd_astermarginTableShowHiddenColumns" data-table-command="show-hidden-columns"/>
        <command id="cmd_astermarginTableClearFilters" data-table-command="clear-filters"/>
        <command id="cmd_astermarginTableClearSort" data-table-command="clear-sort"/>
        <command id="cmd_astermarginTableVersionHistory" data-table-command="version-history"/>
        <command id="cmd_astermarginTableSources" data-table-command="sources"/>
        <command id="cmd_astermarginTableAddItems" data-table-command="add-items"/>
        <command id="cmd_astermarginTableAddColumn" data-table-command="add-column"/>
        <command id="cmd_astermarginTableAddNewItems" data-table-command="add-new-items"/>
        <command id="cmd_astermarginTableFillPending" data-table-command="fill-pending"/>
        <command id="cmd_astermarginTableFillTrial" data-table-command="fill-trial"/>
        <command id="cmd_astermarginTableFillSelected" data-table-command="fill-selected"/>
        <command id="cmd_astermarginTableFillRetry" data-table-command="fill-retry"/>
        <command id="cmd_astermarginTableFillStop" data-table-command="fill-stop"/>
        <command id="cmd_astermarginTableRemoveSelected" data-table-command="remove-selected"/>
        <command id="cmd_astermarginTableAskAsterMargin" data-table-command="ask-astermargin"/>
    </commandset>
    <commandset>
        <command id="cmd_close"/>
        <command id="minimizeWindow" data-l10n-id="window-minimize-command"/>
        <command id="zoomWindow" data-l10n-id="window-zoom-command"/>
    </commandset>

    <keyset id="mainKeyset">
        <key id="key_close" key="W" modifiers="accel" command="cmd_close"/>
        <key id="key_find" key="F" modifiers="accel" command="cmd_astermarginTableFind"/>
    </keyset>
    <!-- Text commands come from Zotero's editMenuOverlay.js. -->
    <keyset id="editMenuKeys">
        <key id="key_undo" data-l10n-id="text-action-undo-shortcut" modifiers="accel" command="cmd_undo"/>
        <!-- l10n and modifiers set in platformKeys.js -->
        <key id="key_redo" command="cmd_redo"/>
        <key id="key_cut" data-l10n-id="text-action-cut-shortcut" modifiers="accel" command="cmd_cut"/>
        <key id="key_copy" data-l10n-id="text-action-copy-shortcut" modifiers="accel" command="cmd_copy"/>
        <key id="key_paste" data-l10n-id="text-action-paste-shortcut" modifiers="accel" command="cmd_paste"/>
        <key id="key_selectAll" data-l10n-id="text-action-select-all-shortcut" modifiers="accel" command="cmd_selectAll"/>
    </keyset>
    <keyset id="macKeyset">
        <key id="key_minimizeWindow"
             command="minimizeWindow"
             data-l10n-id="window-minimize-shortcut"
             modifiers="accel"
             internal="true"/>
    </keyset>

    <menubar id="astermargin-table-menubar">
        <menu id="fileMenu" data-l10n-id="menu-file">
            <menupopup id="menu_FilePopup">
                <menuitem data-l10n-id="astermargin-table-window-show-in-library" command="cmd_astermarginTableShowInLibrary"/>
                <menuseparator/>
                <menuitem data-l10n-id="astermargin-table-window-export-xlsx" command="cmd_astermarginTableExportXlsx"/>
                <menuitem data-l10n-id="astermargin-table-window-export-csv" command="cmd_astermarginTableExportCsv"/>
                <menuitem data-l10n-id="astermargin-table-window-copy-text" command="cmd_astermarginTableCopyText"/>
                <menuseparator/>
                <menuitem id="menu_close" data-l10n-id="astermargin-window-close" command="cmd_close" key="key_close"/>
            </menupopup>
        </menu>

        <menu id="edit-menu" data-l10n-id="menu-edit">
            <menupopup id="menu_EditPopup">
                <menuitem id="menu_undo" key="key_undo" command="cmd_undo" data-l10n-id="text-action-undo"/>
                <menuitem id="menu_redo" key="key_redo" command="cmd_redo" data-l10n-id="text-action-redo"/>
                <menuseparator/>
                <menuitem id="menu_cut" key="key_cut" command="cmd_cut" data-l10n-id="text-action-cut"/>
                <menuitem id="menu_copy" key="key_copy" command="cmd_copy" data-l10n-id="text-action-copy"/>
                <menuitem id="menu_paste" key="key_paste" command="cmd_paste" data-l10n-id="text-action-paste"/>
                <menuseparator/>
                <menuitem id="menu_selectAll" key="key_selectAll" command="cmd_selectAll" data-l10n-id="text-action-select-all"/>
                <menuseparator/>
                <menuitem data-l10n-id="astermargin-table-window-find" command="cmd_astermarginTableFind" key="key_find"/>
            </menupopup>
        </menu>

        <menu id="view-menu" data-l10n-id="menu-view">
            <menupopup id="menu_viewPopup">
                <menuitem type="radio" name="astermargin-table-density" data-density="compact"
                          data-l10n-id="astermargin-table-window-density-compact" command="cmd_astermarginTableDensityCompact"/>
                <menuitem type="radio" name="astermargin-table-density" data-density="cozy"
                          data-l10n-id="astermargin-table-window-density-cozy" command="cmd_astermarginTableDensityCozy"/>
                <menuitem type="radio" name="astermargin-table-density" data-density="tall"
                          data-l10n-id="astermargin-table-window-density-tall" command="cmd_astermarginTableDensityTall"/>
                <menuseparator/>
                <menuitem data-l10n-id="astermargin-table-window-show-hidden-columns" command="cmd_astermarginTableShowHiddenColumns"/>
                <menuitem data-l10n-id="astermargin-table-window-clear-filters" command="cmd_astermarginTableClearFilters"/>
                <menuitem data-l10n-id="astermargin-table-window-clear-sort" command="cmd_astermarginTableClearSort"/>
                <menuseparator/>
                <menuitem data-l10n-id="astermargin-table-window-version-history" command="cmd_astermarginTableVersionHistory"/>
            </menupopup>
        </menu>

        <menu id="astermargin-table-menu" data-l10n-id="astermargin-table-window-menu-table">
            <menupopup id="menu_astermarginTablePopup">
                <menuitem data-l10n-id="astermargin-table-window-add-items" command="cmd_astermarginTableAddItems"/>
                <menuitem data-l10n-id="astermargin-table-window-add-column" command="cmd_astermarginTableAddColumn"/>
                <menuitem data-l10n-id="astermargin-table-window-add-new-items" command="cmd_astermarginTableAddNewItems"/>
                <menuitem data-l10n-id="astermargin-table-window-sources" command="cmd_astermarginTableSources"/>
                <menuseparator/>
                <menuitem data-l10n-id="astermargin-table-window-fill-pending" command="cmd_astermarginTableFillPending"/>
                <menuitem data-l10n-id="astermargin-table-window-fill-trial" command="cmd_astermarginTableFillTrial"/>
                <menuitem data-l10n-id="astermargin-table-window-fill-selected" command="cmd_astermarginTableFillSelected"/>
                <menuitem data-l10n-id="astermargin-table-window-fill-retry" command="cmd_astermarginTableFillRetry"/>
                <menuitem data-l10n-id="astermargin-table-window-fill-stop" command="cmd_astermarginTableFillStop"/>
                <menuseparator/>
                <menuitem data-l10n-id="astermargin-table-window-remove-selected" command="cmd_astermarginTableRemoveSelected"/>
                <menuseparator/>
                <menuitem data-l10n-id="astermargin-table-window-ask-astermargin" command="cmd_astermarginTableAskAsterMargin"/>
            </menupopup>
        </menu>

        <!-- macOS only: the window list comes from macWindowMenu.js, and
             platformKeys.js adds Window → Zotero. -->
        <menu id="windowMenu" data-l10n-id="menu-window-menu">
            <menupopup id="windowPopup">
                <menuitem command="minimizeWindow" key="key_minimizeWindow"/>
                <menuitem command="zoomWindow"/>
                <menuseparator id="sep-window-list"/>
            </menupopup>
        </menu>
    </menubar>

    <!-- React mount point. `astermargin-root` is the scoping root for the shared
         @astermargin/agent-ui sheets, which select `.astermargin-root .foo`; it belongs on
         every element carrying a `astermargin-pane-*` id. -->
    <html:div id="astermargin-pane-table-window" class="astermargin-root display-flex flex-1 flex-col h-full w-full min-w-0 min-h-0" style="height: 100%; width: 100%; display: flex; overflow: hidden;"></html:div>
</window>
